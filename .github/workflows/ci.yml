name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swiftc -O main.swift -o capsswitch
      # Reads the indicator preference without changing it; the daemon itself needs a login session.
      - name: Smoke test
        run: ./capsswitch indicator | grep -q '^indicator: '
